name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install and run actionlint
        run: |
          docker run --rm --mount type=bind,source="$GITHUB_WORKSPACE",target=/repo,readonly rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 /repo/.github/workflows/ci.yml /repo/.github/workflows/dotnet-ci.yml /repo/.github/workflows/dotnet-ci-windows.yml

  consumer-canary:
    name: Consumer canary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.x
      - name: Build consumer fixture
        shell: bash
        run: |
          canary_dir="$RUNNER_TEMP/open-lobotomy-consumer-canary"
          mkdir -p "$canary_dir/nupkg" "$canary_dir/project"
          dotnet pack "$GITHUB_WORKSPACE/test/ConsumerCanary/ConsumerCanary.csproj" --configuration Release --output "$canary_dir/nupkg"
          dotnet new classlib --name OpenLobotomyConsumerCanary --output "$canary_dir/project" --framework net10.0
          dotnet add "$canary_dir/project/OpenLobotomyConsumerCanary.csproj" package OpenLobotomy.ConsumerContract --version 1.0.1 --source "$canary_dir/nupkg"
          cat > "$canary_dir/project/ConsumerContractProbe.cs" <<'EOF'
          using Contract = OpenLobotomy.ConsumerContract.ConsumerContract;

          namespace OpenLobotomyConsumerCanary;

          public static class ConsumerContractProbe
          {
              public static string ContractVersion => Contract.ContractVersion;
          }
          EOF
          dotnet build "$canary_dir/project/OpenLobotomyConsumerCanary.csproj" --configuration Release --warnaserror
